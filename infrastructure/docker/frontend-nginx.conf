server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $user_service http://user-service:10016;
    set $mto_service http://mto:10015;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend","scope":"frontend-only"}';
    }

    # Dependency readiness is distinct from static asset/liveness availability.
    # This forwards health signals only; business APIs still use authentication.
    location = /readyz {
        access_log off;
        proxy_pass $user_service/readyz;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass $mto_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Hashed CRA assets must never fall through to the SPA document. Returning
    # index.html for an obsolete asset URL makes the browser execute HTML as
    # JavaScript and leaves the application on a blank page after an upgrade.
    location ^~ /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Route fallbacks may use the SPA document, but that document must be
    # revalidated so a rebuilt image cannot strand clients on old asset hashes.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
