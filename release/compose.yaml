      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      PG_ADMIN_USER: "${PG_ADMIN_USER:-postgres}"
      PG_ADMIN_PASSWORD_FILE: "/run/secrets/postgres_admin_password"
      VF_DB_HOST: "${DB_HOST:-postgres}"
      VF_DB_PORT: "${DB_PORT:-5432}"
      VF_DB_NAME: "${MTA_DB_NAME:-vectorflow_mta}"
      VF_DB_USER: "${PG_ADMIN_USER:-postgres}"
      VF_DB_PASSWORD_FILE: "/run/secrets/postgres_admin_password"
      VF_SECRET_KEY_FILE: "/run/secrets/mta_secret"
      MTA_DB_NAME: "${MTA_DB_NAME:-vectorflow_mta}"
      MTA_OWNER_ROLE: "${MTA_OWNER_ROLE:-vectorflow_mta_owner}"
      MTA_INSTALLER_ROLE: "${MTA_INSTALLER_ROLE:-vectorflow_mta_installer}"
      MTA_RUNTIME_ROLE: "${MTA_RUNTIME_ROLE:-vectorflow_mta_runtime}"
      MTA_INSTALLER_PASSWORD_FILE: "/run/secrets/mta_installer_password"
      MTA_RUNTIME_PASSWORD_FILE: "/run/secrets/mta_runtime_password"
      MTO_DB_NAME: "${MTO_DB_NAME:-vectorflow_mto}"
      MTO_OWNER_ROLE: "${MTO_OWNER_ROLE:-vectorflow_mto_owner}"
      MTO_INSTALLER_ROLE: "${MTO_INSTALLER_ROLE:-vectorflow_mto_installer}"
      MTO_RUNTIME_ROLE: "${MTO_RUNTIME_ROLE:-vectorflow_mto_runtime}"
      MTO_INSTALLER_PASSWORD_FILE: "/run/secrets/mto_installer_password"
      MTO_RUNTIME_PASSWORD_FILE: "/run/secrets/mto_runtime_password"
      AUTH_OWNER_ROLE: "${AUTH_OWNER_ROLE:-vectorflow_auth_owner}"
      AUTH_INSTALLER_ROLE: "${AUTH_INSTALLER_ROLE:-vectorflow_auth_installer}"
      AUTH_RUNTIME_ROLE: "${AUTH_RUNTIME_ROLE:-vectorflow_auth_runtime}"
      AUTH_INSTALLER_PASSWORD_FILE: "/run/secrets/auth_installer_password"
      AUTH_RUNTIME_PASSWORD_FILE: "/run/secrets/auth_runtime_password"
    secrets:
      - "postgres_admin_password"
      - "mta_secret"
      - "mta_installer_password"
      - "mta_runtime_password"
      - "mto_installer_password"
      - "mto_runtime_password"
      - "auth_installer_password"
      - "auth_runtime_password"
    depends_on:
      postgres:
        condition: "service_healthy"
  auth-worker:
    extends:
      service: auth
    profiles: [maintenance]
    entrypoint: [python, -m, release.service, auth-worker]
    healthcheck:
      test: [CMD, python, -c, "import os;os.kill(1,0)"]
  auth-beat:
    extends:
      service: auth
    profiles: [maintenance]
    entrypoint: [python, -m, release.service, auth-beat]
    healthcheck:
      test: [CMD, python, -c, "import os;os.kill(1,0)"]
secrets:
  postgres_admin_password:
    file: "${VF_SECRETS_DIR:-./secrets}/postgres_admin_password"
  mta_secret:
    file: "${VF_SECRETS_DIR:-./secrets}/mta_secret"
  auth_secret:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_secret"
  mto_secret:
    file: "${VF_SECRETS_DIR:-./secrets}/mto_secret"
  auth_private_key:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_private_key"
  auth_public_key:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_public_key"
  auth_runtime_password_enc:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_runtime_password_enc"
  auth_installer_password_enc:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_installer_password_enc"
  mta_installer_password:
    file: "${VF_SECRETS_DIR:-./secrets}/mta_installer_password"
  mta_runtime_password:
    file: "${VF_SECRETS_DIR:-./secrets}/mta_runtime_password"
  mto_installer_password:
    file: "${VF_SECRETS_DIR:-./secrets}/mto_installer_password"
  mto_runtime_password:
    file: "${VF_SECRETS_DIR:-./secrets}/mto_runtime_password"
  auth_installer_password:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_installer_password"
  auth_runtime_password:
    file: "${VF_SECRETS_DIR:-./secrets}/auth_runtime_password"
volumes:
  postgres_data: {}
  redis_data: {}
  mta_data: {}
  auth_data: {}
  auth_logs: {}
  mto_data: {}
  mto_downloads: {}
  mto_logs: {}
networks:
