        REACT_APP_VF_API_HOST_MTO: "/api/mto"
        REACT_APP_WS_API_HOST: "${VF_PUBLIC_WS_URL:?Set public ws/wss origin}"
        REACT_APP_SECRET_KEY: "${VF_CLIENT_CIPHER_KEY:?}"
        REACT_APP_AG_GRID_LICENSE_KEY: "${REACT_APP_AG_GRID_LICENSE_KEY:-}"
        FRONTEND_BUILD_HEAP_MIB: "${FRONTEND_BUILD_HEAP_MIB:-}"
        VF_CONSTRAINED_BUILD: "${VF_CONSTRAINED_BUILD:-0}"
    environment:
      VF_TLS_MODE: "${VF_TLS_MODE:-http}"
      VF_PUBLIC_URL: "${VF_PUBLIC_URL:?Set public origin}"
      VF_PROXY_READ_TIMEOUT: "${VF_PROXY_READ_TIMEOUT:-180}"
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=128m"
    ports:
      - "${VF_BIND_ADDRESS:-127.0.0.1}:${VF_HTTP_PORT:-8080}:80"
    depends_on:
      auth:
        condition: "service_healthy"
      mto:
        condition: "service_healthy"
      mta:
        condition: "service_healthy"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "--spider"
        - "http://127.0.0.1:8081/healthz"
      interval: "10s"
      timeout: "5s"
      retries: 6
