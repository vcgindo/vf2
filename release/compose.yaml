# **DO NOT MODIFY FRONTEND CODE OR THE MTO STACK. Preserve the original frontend presentation and behavior. No frontend redesign, substitute screens, refactoring or MTO changes. Any future exception requires explicit human authorization.**
name: "${VF_PROJECT:-vectorflow}"
services:
  daily:
    extends: {service: mta-install}
    profiles: [daily]
    entrypoint: [python]
    command: [manage.py, process_daily_csv, --help]
    read_only: true
    tmpfs: [/tmp]
    environment:
      VF_WORK_ROOT: "/var/lib/vectorflow/work"
      VF_MTA_SELECTION_FILE: ""
      VF_MTA_PUBLISHED_RUN: ""
      VF_MTA_PUBLISHED_DIGEST: ""
      VF_BTR_REPORTING_GENERATION: ""
  postgres:
    platform: "linux/amd64"
    restart: "no"
    networks:
      - "application"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "${VF_LOG_MAX_SIZE:-10m}"
        max-file: "${VF_LOG_FILES:-3}"
    image: "postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    environment:
      POSTGRES_USER: "${PG_ADMIN_USER:-postgres}"
      POSTGRES_DB: "postgres"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_admin_password"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    secrets:
      - "postgres_admin_password"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"
      interval: "10s"
      timeout: "5s"
      retries: 6
  redis:
    platform: "linux/amd64"
    restart: "no"
    networks:
      - "application"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "${VF_LOG_MAX_SIZE:-10m}"
        max-file: "${VF_LOG_FILES:-3}"
    image: "redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - ""
    volumes:
      - "redis_data:/data"
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "ping"
      interval: "10s"
      timeout: "5s"
      retries: 6
  mta:
    platform: "linux/amd64"
    restart: "no"
    networks:
      - "application"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "${VF_LOG_MAX_SIZE:-10m}"
        max-file: "${VF_LOG_FILES:-3}"
    image: "${VF_IMAGE_PREFIX:-vectorflow}/mta:${VF_RELEASE:?Set pinned release}"
    pull_policy: "never"
    environment:
      VF_INPUT_ARCHIVE_MAX_COMPRESSED_BYTES: "${VF_INPUT_ARCHIVE_MAX_COMPRESSED_BYTES:-67108864}"
      VF_INPUT_ARCHIVE_MAX_UNCOMPRESSED_BYTES: "${VF_INPUT_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-268435456}"
      VF_PUBLIC_URL: "${VF_PUBLIC_URL:?Set public origin}"
      VF_ALLOWED_HOSTS: "${VF_ALLOWED_HOSTS:-localhost,127.0.0.1,mta,mto,auth}"
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DJANGO_SETTINGS_MODULE: "release.mta_settings"
      VF_NATIVE_RELEASE_COMMIT: "${VF_NATIVE_RELEASE_COMMIT:?Set exact native source commit}"
      VF_NATIVE_RELEASE_SHA256: "${VF_NATIVE_RELEASE_SHA256:?Set independent native manifest SHA256}"
      VF_DB_HOST: "${DB_HOST:-postgres}"
      VF_DB_PORT: "${DB_PORT:-5432}"
      VF_DB_NAME: "${MTA_DB_NAME:-vectorflow_mta}"
      VF_DB_USER: "${MTA_RUNTIME_ROLE:-vectorflow_mta_runtime}"
      MTA_OWNER_ROLE: "${MTA_OWNER_ROLE:-vectorflow_mta_owner}"
      VF_DB_PASSWORD_FILE: "/run/secrets/mta_runtime_password"
      VF_SECRET_KEY_FILE: "/run/secrets/mta_secret"
      MTA_WORKERS: "${MTA_WORKERS:-2}"
      MTA_TIMEOUT: "${MTA_TIMEOUT:-180}"
      MTA_GRACEFUL_TIMEOUT: "${MTA_GRACEFUL_TIMEOUT:-30}"
      VF_MTA_NATIVE_PUBLICATION: "1"
      VF_MTA_DAILY_PUBLICATION: "1"
      VF_MTA_ACTIONS_ENABLED: "1"
      VF_MTA_LOGISTICS_CURRENT: "1"
      VF_MTA_ALLOW_UNSELECTED_STARTUP: "1"
      VF_MTA_SELECTION_FILE: "${MTA_SELECTION_FILE:-}"
      VF_MTA_PERMISSIONS_FILE: "${MTA_PERMISSIONS_FILE:-}"
      VF_MTA_PERMISSIONS_SHA256: "${MTA_PERMISSIONS_SHA256:-}"
      VF_MTA_HIERARCHY_FILE: "${MTA_HIERARCHY_FILE:-}"
      VF_MTA_HIERARCHY_SHA256: "${MTA_HIERARCHY_SHA256:-}"
      VF_MTA_ACTION_TIME_ZONE: "${MTA_ACTION_TIME_ZONE:-Asia/Kolkata}"
      VF_BPR_PREPARED: "1"
      VF_RRR_PREPARED: "1"
      VF_GUIDED_PREPARED: "1"
      VF_HISTORY_REPORTS_PREPARED: "1"
      VF_RESEARCH_AVAILABILITY_PREPARED: "1"
    secrets:
      - "mta_secret"
      - "mta_runtime_password"
    volumes:
      - "mta_data:/var/lib/vectorflow:ro"
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=128m"
    depends_on:
      postgres:
        condition: "service_healthy"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"
      interval: "10s"
      timeout: "5s"
      retries: 6
      start_period: "30s"
  auth:
    platform: "linux/amd64"
    restart: "no"
    networks:
      - "application"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "${VF_LOG_MAX_SIZE:-10m}"
        max-file: "${VF_LOG_FILES:-3}"
    image: "${VF_IMAGE_PREFIX:-vectorflow}/auth:${VF_RELEASE:?Set pinned release}"
    build:
      context: ".."
      dockerfile: "release/auth.Dockerfile"
    environment:
      VF_PUBLIC_URL: "${VF_PUBLIC_URL:?Set public origin}"
      VF_ALLOWED_HOSTS: "${VF_ALLOWED_HOSTS:-localhost,127.0.0.1,mta,mto,auth}"
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DJANGO_SETTINGS_MODULE: "release.auth_settings"
      DB_NAME: "${MTO_DB_NAME:-vectorflow_mto}"
      DB_USER: "${AUTH_RUNTIME_ROLE:-vectorflow_auth_runtime}"
      DB_PASSWORD_FILE: "/run/secrets/auth_runtime_password_enc"
      SECRET_KEY_FILE: "/run/secrets/auth_secret"
      CLIENT_CIPHER_KEY: "${VF_CLIENT_CIPHER_KEY:?Public browser cipher configuration required}"
      USER_SERVICE_RSA_PRIVATE_KEY_PATH: "/run/secrets/auth_private_key"
      USER_SERVICE_RSA_PUBLIC_KEY_PATH: "/run/secrets/auth_public_key"
      BASE_CLIENT_URL: "${VF_PUBLIC_URL:?}"
      PASSWORD_RESET_TIMEOUT: "${PASSWORD_RESET_TIMEOUT:-28800}"
      MTA_BACKEND_URL: "http://mta:8000"
      MTO_BACKEND_URL: "http://mto:10015"
      AUTH_WORKERS: "${AUTH_WORKERS:-1}"
      AUTH_KEEP_ALIVE: "${AUTH_KEEP_ALIVE:-5}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      STORE_DATA: "/var/lib/vectorflow"
      USER_STORIES_STORAGE: "/var/lib/vectorflow/user-stories"
      DEFAULT_FOLDER_CSV: "/var/lib/vectorflow/uploads"
      DB_BACKUP_FOLDER: "/var/lib/vectorflow/backups"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASS: "${EMAIL_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      EMAIL_NAME: "${EMAIL_NAME:-VectorFLOW}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-false}"
      EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-15}"
      DEBUG: "false"
      ENVIRONMENT: "production"
    secrets:
      - "auth_secret"
      - "auth_runtime_password_enc"
      - "auth_private_key"
      - "auth_public_key"
    volumes:
      - "auth_data:/var/lib/vectorflow"
      - "auth_logs:/app/logs"
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=128m"
    depends_on:
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:10016/healthz',timeout=3)"
      interval: "10s"
      timeout: "5s"
      retries: 6
      start_period: "30s"
  mto:
    platform: "linux/amd64"
    restart: "no"
    networks:
      - "application"
    security_opt:
      - "no-new-privileges:true"
    logging:
