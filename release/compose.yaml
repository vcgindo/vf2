      DB_NAME: "${MTO_DB_NAME:-vectorflow_mto}"
      DB_USER: "${MTO_RUNTIME_ROLE:-vectorflow_mto_runtime}"
      DB_PASSWORD_FILE: "/run/secrets/mto_runtime_password"
      SECRET_KEY_FILE: "/run/secrets/mto_secret"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      MTO_HTTP_TIMEOUT: "${MTO_HTTP_TIMEOUT:-180}"
      MTO_WEBSOCKET_CONNECT_TIMEOUT: "${MTO_WEBSOCKET_CONNECT_TIMEOUT:-30}"
      MTO_WEBSOCKET_PING_INTERVAL: "${MTO_WEBSOCKET_PING_INTERVAL:-20}"
      MTO_WEBSOCKET_PING_TIMEOUT: "${MTO_WEBSOCKET_PING_TIMEOUT:-30}"
      DEBUG: "false"
    secrets:
      - "mto_secret"
      - "mto_runtime_password"
    volumes:
