<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      if ('%REACT_APP_VF_SCREEN_PROBE%' === '1') {
        window.__VF_STARTUP_TRACE = { id: crypto.randomUUID().replace(/-/g, ''), marks: [], longTasks: [] };
        var vfTrace = window.__VF_STARTUP_TRACE;
        var vfMark = function (name) { if (vfTrace.marks.length < 120) vfTrace.marks.push({name:name, at:performance.now()}); };
        vfMark('head-observer');
        document.addEventListener('DOMContentLoaded', function () { vfMark('DOMContentLoaded'); });
        window.addEventListener('load', function () { vfMark('window-load'); });
        document.addEventListener('load', function (event) {
          var target = event.target;
          if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT')) vfMark(target.tagName + ':' + (target.href || target.src || '').split('?')[0]);
        }, true);
        document.addEventListener('DOMContentLoaded', function () {
          document.fonts.ready.then(function () { vfMark('fonts-ready-after-DCL'); });
        });
        try { new PerformanceObserver(function (list) { list.getEntries().forEach(function (entry) { if (vfTrace.longTasks.length < 120) vfTrace.longTasks.push({start:entry.startTime,duration:entry.duration,name:entry.name}); }); }).observe({type:'longtask',buffered:true}); } catch (_) {}
      }
    </script>
    <link rel="icon" href="%PUBLIC_URL%/assets/Favicon White.png" />
    <meta name="viewport" content="width=device-width, initial-scale=2" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="VectorFlow Accelerating The Workflow" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/img/logo.png" />
    <meta property="og:image" content="%PUBLIC_URL%/assets/img/logo.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Vector Flow">
    <meta property="og:description" content="Accelerating The Workflow">
    <link rel="stylesheet" href="%PUBLIC_URL%/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Vector Flow</title>
  </head>

    <div id="root"></div>

</html>
